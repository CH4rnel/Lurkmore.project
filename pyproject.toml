# inb4: just_for_lulz

[project]
name = "lurkmore-rag"
version = "0.1.0"
description = "Private RAG-agent for Telegram chats in AIB style"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.33.1",
    "asyncpg>=0.29.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]